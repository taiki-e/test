name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - main
      - dev*
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTDOCFLAGS: -D warnings
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 10
  TIDY_EXPECTED_MARKDOWN_FILE_COUNT: 4
  TIDY_EXPECTED_RUST_FILE_COUNT: 5
  TIDY_EXPECTED_CLANG_FORMAT_FILE_COUNT: 0
  TIDY_EXPECTED_PRETTIER_FILE_COUNT: 8
  TIDY_EXPECTED_TOML_FILE_COUNT: 9
  TIDY_EXPECTED_SHELL_FILE_COUNT: 6
  TIDY_EXPECTED_DOCKER_FILE_COUNT: 1

defaults:
  run:
    shell: bash --noprofile --norc -CeEuxo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tidy:
    uses: taiki-e/github-actions/.github/workflows/tidy.yml@main
    permissions:
      security-events: write # for github/codeql-action/*
    with:
      ruleset: false
      immutable-release: false
  codegen:
    needs: tidy
    uses: taiki-e/github-actions/.github/workflows/gen.yml@main
    permissions:
      contents: write # for creating branch for pr
    secrets:
      PR_TOKEN_APP_PRIVATE_KEY: ${{ secrets.PR_TOKEN_APP_PRIVATE_KEY }}
    with:
      pr-token-app-client-id: ${{ vars.PR_TOKEN_APP_CLIENT_ID }}
  test:
    needs: tidy
    uses: taiki-e/github-actions/.github/workflows/rust-test.yml@main
    with:
      target: x86_64-unknown-linux-gnu,aarch64-apple-darwin,x86_64-pc-windows-msvc,aarch64-unknown-linux-gnu,x86_64-apple-darwin,x86_64-pc-windows-gnu

  test-tidy:
    needs: tidy
    env:
      TIDY_DEV: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          # NB: Sync list with https://github.com/taiki-e/checkout-action/blob/HEAD/.github/workflows/ci.yml
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: ubuntu-22.04
          - os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: taiki-e/checkout-action@v1
      # docker
      - run: tools/tidy.sh
      # https://github.com/ScribeMD/rootless-docker/pull/402
      - uses: AJGranowski/rootless-docker-action@23266b5b1fa508009c9ac4be4f8bde450fc3e269 # zizmor: ignore[stale-action-refs]
      - run: docker info -f '{{println .SecurityOptions}}' | grep -F rootless
      - run: tools/tidy.sh
      - run: |
          sudo systemctl stop docker.service || true
          sudo systemctl stop docker.socket || true
          sudo systemctl stop containerd.service || true
          sudo apt-get -qq -o Dpkg::Use-Pty=0 purge -y 'docker*'
          sudo rm -rf -- /etc/systemd/system/containerd.service
      # podman
      - run: |
          podman info | grep -F 'rootless: true'
      - run: TIDY_DOCKER_PATH=podman ./tools/tidy.sh
      # https://github.com/actions/runner-images/blob/HEAD/images/ubuntu/scripts/build/install-container-tools.sh
      - run: sudo apt-get -qq -o Dpkg::Use-Pty=0 purge -y podman buildah skopeo
      # nerdctl
      - name: Install nerdctl
        run: |
          retry() {
            for i in {1..10}; do
              if "$@"; then
                return 0
              else
                sleep "${i}"
              fi
            done
            "$@"
          }
          # https://github.com/containerd/nerdctl/releases
          nerdctl_version=2.2.2
          case "$(uname -m)" in
            aarch64 | arm64) nerdctl_arch=arm64 ;;
            *) nerdctl_arch=amd64 ;;
          esac
          retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 "https://github.com/containerd/nerdctl/releases/download/v${nerdctl_version}/nerdctl-full-${nerdctl_version}-linux-${nerdctl_arch}.tar.gz" | sudo tar xzf - -C /usr/local
          if [[ "${OS}" != 'ubuntu-22.04'* ]]; then
            # https://rootlesscontaine.rs/getting-started/common/apparmor/
            sudo tee -- /etc/apparmor.d/usr.local.bin.rootlesskit >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          /usr/local/bin/rootlesskit flags=(unconfined) {
            userns,

            # Site-specific additions and overrides. See local/README for details.
            include if exists <local/usr.local.bin.rootlesskit>
          }
          EOF
            sudo systemctl restart apparmor.service
          fi
          containerd-rootless-setuptool.sh install
        env:
          OS: ${{ matrix.os }}
      - run: nerdctl info -f '{{println .SecurityOptions}}' | grep -F rootless
      - run: TIDY_DOCKER_PATH=nerdctl ./tools/tidy.sh

  test-old-tidy:
    needs: tidy
    strategy:
      fail-fast: false
      matrix:
        include:
          # NB: Sync list with https://github.com/taiki-e/checkout-action/blob/HEAD/.github/workflows/ci.yml
          # --------------------------------------------------------------------
          # GitHub-hosted runners
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: ubuntu-22.04
          - os: ubuntu-22.04-arm
          - os: ubuntu-slim
          - os: macos-26
          - os: macos-15
          - os: macos-15-intel
          - os: windows-2025
          - os: windows-2025
            bash: msys2
          - os: windows-2025
            bash: cygwin
          - os: windows-2022
          - os: windows-2022
            bash: msys2
          - os: windows-2022
            bash: cygwin
          - os: windows-11-arm
          # --------------------------------------------------------------------
          # Containers
          # debian 9's python3 is 3.5.3, ubuntu 16.04's python3 is 3.5.2, ubuntu 14.04's python3 is 3.4,
          # we got "SyntaxError: invalid syntax" when using yq with python 3.5.2 and older,
          # and we got "Python 3.6 or later is required" when using yq with python 3.5 and older.
          # --------------------------------------------------------------------
          # Debian-based
          - container: debian:sid # glibc
          - container: debian:testing # glibc
          - container: debian:13-slim # glibc 2.41
          - container: debian:12-slim # glibc 2.36
          - container: debian:11-slim # glibc 2.31, EoL
          - container: debian:10-slim # glibc 2.28, EoL, end of LTS
          # - container: debian:9-slim # glibc 2.24, EoL, end of LTS
          # - container: debian/eol:jessie-slim # 8, glibc 2.19, EoL, end of LTS
          - container: ubuntu:devel # glibc
          - container: ubuntu:rolling # glibc
          - container: ubuntu:26.04 # glibc 2.43
          - container: ubuntu:24.04 # glibc 2.39
          - container: ubuntu:22.04 # glibc 2.35
          - container: ubuntu:20.04 # glibc 2.31, EoL
          - container: ubuntu:18.04 # glibc 2.27, EoL
          # - container: ubuntu:16.04 # glibc 2.23, EoL, end of ESM
          # - container: ubuntu:14.04 # glibc 2.19, EoL, end of ESM
          # --------------------------------------------------------------------
          # Fedora/RHEL-based
          - container: fedora:latest # glibc
          - container: centos:7 # glibc 2.17, EoL
          # - container: centos:6 # glibc 2.12, EoL, rustc/nodejs requires glibc 2.17
          - container: almalinux:10 # glibc 2.39
          - container: almalinux:10-minimal # glibc 2.39
          - container: almalinux:9 # glibc 2.34
          - container: almalinux:9-minimal # glibc 2.34
          - container: almalinux:8 # glibc 2.28
          - container: almalinux:8-minimal # glibc 2.28
          # --------------------------------------------------------------------
          # apk
          - container: alpine:latest # musl
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    steps:
      - run: |
          printf '%s\n' 'C:\msys64\mingw32\bin' >>"${GITHUB_PATH}"
          printf '%s\n' 'C:\msys64\usr\bin' >>"${GITHUB_PATH}"
        if: matrix.bash == 'msys2'
      - run: |
          choco install --no-progress --requirechecksums cygwin
          printf '%s\n' 'C:\tools\cygwin\bin' >>"${GITHUB_PATH}"
          printf '%s\n' 'C:\tools\cygwin\usr\bin' >>"${GITHUB_PATH}"
        if: matrix.bash == 'cygwin'
      - name: Install requirements (macOS)
        run: brew install clang-format
        if: startsWith(matrix.os, 'macos')
      - name: Install requirements (ubuntu-slim)
        run: |
          sudo apt-get -o Acquire::Retries=10 -qq update
          sudo apt-get -o Acquire::Retries=10 -o Dpkg::Use-Pty=0 install -y --no-install-recommends clang-format
        if: matrix.os == 'ubuntu-slim'
      - name: Install requirements (Ubuntu/Debian container)
        run: |
          retry() {
            for i in {1..10}; do
              if "$@"; then
                return 0
              else
                sleep "${i}"
              fi
            done
            "$@"
          }
          case "${CONTAINER}" in
            debian:9* | debian:10*)
              # In Debian, the old repositories is removed from the main mirrors some time after EoL.
              codename=$(grep -E '^VERSION_CODENAME=' /etc/os-release | cut -d= -f2)
              sed -i /etc/apt/sources.list -e 's/deb.debian.org/archive.debian.org/g' \
                -e 's|security.debian.org|archive.debian.org/|g' \
                -e "/${codename}-updates/d"
              ;;
          esac
          retry apt-get -o Acquire::Retries=10 -qq update
          retry apt-get -o Acquire::Retries=10 -o Dpkg::Use-Pty=0 install -y --no-install-recommends ca-certificates curl xz-utils clang-format python3-venv
          case "${CONTAINER}" in
            # ubuntu 18.04/16.04 and debian 10/9's jq is 1.5, ubuntu 14.04's jq is 1.3
            # jq: error (at <stdin>:44): Invalid path expression near attempt to access element 0 of [0]
            # tools/tidy.sh: error on line 408: jq 'del(.dictionaryDefinitions[] | select(.name == "organization-dictionary" | not))'
            ubuntu:1?.04 | debian:10* | debian:9*)
              retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 -o /usr/local/bin/jq https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64
              chmod +x /usr/local/bin/jq
              ;;
          esac
        env:
          CONTAINER: ${{ matrix.container }}
        if: startsWith(matrix.container, 'ubuntu') || startsWith(matrix.container, 'debian')
      - name: Install requirements (Fedora/Alma/CentOS)
        run: |
          retry() {
            for i in {1..10}; do
              if "$@"; then
                return 0
              else
                sleep "${i}"
              fi
            done
            "$@"
          }
          if type -P dnf >/dev/null; then
            retry dnf install -y clang-tools-extra python3
          elif type -P microdnf >/dev/null; then
            retry microdnf install -y tar xz clang-tools-extra python3
          else
            # In CentOS, the old repositories is removed from the main mirrors just after EoL.
            # https://github.com/rust-lang/rust/pull/126352
            sed -i /etc/yum.repos.d/*.repo -e 's!^mirrorlist!#mirrorlist!' \
              -e 's!^#baseurl=http://mirror.centos.org/!baseurl=https://vault.centos.org/!'
            sed -i 's/enabled=1/enabled=0/' /etc/yum/pluginconf.d/fastestmirror.conf
            retry yum install -y xz clang python3
          fi
        if: startsWith(matrix.container, 'fedora') || startsWith(matrix.container, 'almalinux') || startsWith(matrix.container, 'centos')
      - name: Install requirements (Alpine)
        run: apk --no-cache add ca-certificates curl clang-extra-tools npm python3
        shell: sh
        if: startsWith(matrix.container, 'alpine')
      - uses: taiki-e/checkout-action@v1
      - name: Install Node.js
        run: |
          retry() {
            for i in {1..10}; do
              if "$@"; then
                return 0
              else
                sleep "${i}"
              fi
            done
            "$@"
          }
          mkdir -p -- /node
          node_version=20.20.2
          case "${CONTAINER}" in
            ubuntu:1?.04 | debian:9* | centos:7) url="https://unofficial-builds.nodejs.org/download/release/v${node_version}/node-v${node_version}-linux-x64-glibc-217.tar.xz" ;;
            *) url="https://nodejs.org/dist/v${node_version}/node-v${node_version}-linux-x64.tar.xz" ;;
          esac
          retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 "${url}" | tar xJf - --strip-components 1 -C /node
          printf '/node/bin\n' >>"${GITHUB_PATH}"
        env:
          CONTAINER: ${{ matrix.container }}
        if: matrix.container != '' && (!startsWith(matrix.container, 'alpine'))
      - uses: taiki-e/install-action@v2
        with:
          tool: rust@nightly,shellcheck,shfmt,parse-dockerfile,uv
          fallback: none
      - uses: taiki-e/install-action@v2
        with:
          tool: zizmor
          fallback: none
        if: matrix.container == '' || !(startsWith(matrix.container, 'ubuntu:1') || startsWith(matrix.container, 'ubuntu:20') || startsWith(matrix.container, 'debian:10') || startsWith(matrix.container, 'debian:11') || startsWith(matrix.container, 'almalinux:8') || startsWith(matrix.container, 'centos') || startsWith(matrix.container, 'alpine'))
      - run: |
          retry() {
            for i in {1..10}; do
              if "$@"; then
                return 0
              else
                sleep "${i}"
              fi
            done
            "$@"
          }
          retry curl --proto '=https' --tlsv1.2 -fsSL --retry 10 "https://github.com/cargo-bins/cargo-quickinstall/releases/download/zizmor-1.18.0/zizmor-1.18.0-x86_64-unknown-linux-musl.tar.gz" | tar xzf - -C "${HOME}/.cargo/bin"
        if: startsWith(matrix.container, 'ubuntu:1') || startsWith(matrix.container, 'ubuntu:20') || startsWith(matrix.container, 'debian:10') || startsWith(matrix.container, 'debian:11') || startsWith(matrix.container, 'almalinux:8') || startsWith(matrix.container, 'centos') || startsWith(matrix.container, 'alpine')
      # min-release-age and allow-git requires npm 11.10+
      - run: npm --version
      - run: sudo npm install --location=global npm@11.11.0
        if: startsWith(matrix.os, 'ubuntu')
      - run: npm install --location=global npm@11.11.0
        if: (!startsWith(matrix.os, 'ubuntu'))
      - run: type -P bash
      - run: tools/ci/tidy-show-deps.sh
      - run: tools/ci/tidy.sh
        # Unsupported NodeJS version (19.9.0); >=20 is required
        if: matrix.os != 'windows-11-arm'
      - run: brew install bash
        if: startsWith(matrix.os, 'macos')
      - run: type -P bash | grep -E '^(/usr/local/|/opt/homebrew/)'
        if: startsWith(matrix.os, 'macos')
      - run: tools/ci/tidy-show-deps.sh
        if: startsWith(matrix.os, 'macos')
      - run: tools/ci/tidy.sh
        if: startsWith(matrix.os, 'macos')
  test-old-tidy-vm:
    needs: tidy
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            version: '15.0'
          - os: freebsd
            version: '14.4'
          - os: freebsd
            version: '13.5'
          - os: freebsd
            version: '12.4'
          - os: netbsd
            version: '10.1'
          - os: netbsd
            version: '9.4'
          - os: openbsd
            version: '7.8'
          - os: dragonflybsd
            version: '6.4.2'
          - os: midnightbsd
            version: '4.0.4'
          - os: solaris
            version: '11.4'
          - os: omnios
            version: 'r151058'
          - os: openindiana
            version: '202510'
          - os: haiku
            version: 'r1beta5'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: vm-sh {0}
    steps:
      - uses: taiki-e/checkout-action@v1
      # This approach is not best because all actions are downloaded.
      - uses: vmactions/freebsd-vm@d1e65811565151536c0c894fff74f06351ed26e6 # v1.4.5
        with:
          release: ${{ matrix.version }}
          envs: CARGO_INCREMENTAL CARGO_NET_RETRY CARGO_TERM_COLOR RUST_BACKTRACE RUST_TEST_THREADS RUSTDOCFLAGS RUSTFLAGS RUSTUP_MAX_RETRIES TIDY_EXPECTED_MARKDOWN_FILE_COUNT TIDY_EXPECTED_RUST_FILE_COUNT TIDY_EXPECTED_CLANG_FORMAT_FILE_COUNT TIDY_EXPECTED_PRETTIER_FILE_COUNT TIDY_EXPECTED_TOML_FILE_COUNT TIDY_EXPECTED_SHELL_FILE_COUNT TIDY_EXPECTED_DOCKER_FILE_COUNT
          usesh: true
          custom-shell-name: vm-sh
          copyback: false
        if: matrix.os == 'freebsd'
      - uses: vmactions/netbsd-vm@eb3ba840926911ccf17dc9de235335cb27a02ba0 # v1.3.8
        with:
          release: ${{ matrix.version }}
          envs: CARGO_INCREMENTAL CARGO_NET_RETRY CARGO_TERM_COLOR RUST_BACKTRACE RUST_TEST_THREADS RUSTDOCFLAGS RUSTFLAGS RUSTUP_MAX_RETRIES TIDY_EXPECTED_MARKDOWN_FILE_COUNT TIDY_EXPECTED_RUST_FILE_COUNT TIDY_EXPECTED_CLANG_FORMAT_FILE_COUNT TIDY_EXPECTED_PRETTIER_FILE_COUNT TIDY_EXPECTED_TOML_FILE_COUNT TIDY_EXPECTED_SHELL_FILE_COUNT TIDY_EXPECTED_DOCKER_FILE_COUNT
          usesh: true
          custom-shell-name: vm-sh
          copyback: false
        if: matrix.os == 'netbsd'
      - uses: vmactions/openbsd-vm@d7d892b7b9ba97ed2747b0fc201be65037d64c3e # v1.4.0
        with:
          release: ${{ matrix.version }}
          envs: CARGO_INCREMENTAL CARGO_NET_RETRY CARGO_TERM_COLOR RUST_BACKTRACE RUST_TEST_THREADS RUSTDOCFLAGS RUSTFLAGS RUSTUP_MAX_RETRIES TIDY_EXPECTED_MARKDOWN_FILE_COUNT TIDY_EXPECTED_RUST_FILE_COUNT TIDY_EXPECTED_CLANG_FORMAT_FILE_COUNT TIDY_EXPECTED_PRETTIER_FILE_COUNT TIDY_EXPECTED_TOML_FILE_COUNT TIDY_EXPECTED_SHELL_FILE_COUNT TIDY_EXPECTED_DOCKER_FILE_COUNT
          usesh: true
          custom-shell-name: vm-sh
          copyback: false
        if: matrix.os == 'openbsd'
      - uses: vmactions/dragonflybsd-vm@17fba5ae01ae16ac714dead56eed198c3b2e210e # v1.2.8
        with:
          release: ${{ matrix.version }}
          envs: CARGO_INCREMENTAL CARGO_NET_RETRY CARGO_TERM_COLOR RUST_BACKTRACE RUST_TEST_THREADS RUSTDOCFLAGS RUSTFLAGS RUSTUP_MAX_RETRIES TIDY_EXPECTED_MARKDOWN_FILE_COUNT TIDY_EXPECTED_RUST_FILE_COUNT TIDY_EXPECTED_CLANG_FORMAT_FILE_COUNT TIDY_EXPECTED_PRETTIER_FILE_COUNT TIDY_EXPECTED_TOML_FILE_COUNT TIDY_EXPECTED_SHELL_FILE_COUNT TIDY_EXPECTED_DOCKER_FILE_COUNT
          usesh: true
          custom-shell-name: vm-sh
          copyback: false
        if: matrix.os == 'dragonflybsd'
      - uses: vmactions/midnightbsd-vm@cef150e7c5fe95948219a18e0d194beb384a6696 # v1.0.1
        with:
          release: ${{ matrix.version }}
          envs: CARGO_INCREMENTAL CARGO_NET_RETRY CARGO_TERM_COLOR RUST_BACKTRACE RUST_TEST_THREADS RUSTDOCFLAGS RUSTFLAGS RUSTUP_MAX_RETRIES TIDY_EXPECTED_MARKDOWN_FILE_COUNT TIDY_EXPECTED_RUST_FILE_COUNT TIDY_EXPECTED_CLANG_FORMAT_FILE_COUNT TIDY_EXPECTED_PRETTIER_FILE_COUNT TIDY_EXPECTED_TOML_FILE_COUNT TIDY_EXPECTED_SHELL_FILE_COUNT TIDY_EXPECTED_DOCKER_FILE_COUNT
          usesh: true
          custom-shell-name: vm-sh
          copyback: false
        if: matrix.os == 'midnightbsd'
      - uses: vmactions/solaris-vm@c20562b2c69737b06be9e828915761703e487373 # v1.3.3
        with:
          release: ${{ matrix.version }}
          envs: CARGO_INCREMENTAL CARGO_NET_RETRY CARGO_TERM_COLOR RUST_BACKTRACE RUST_TEST_THREADS RUSTDOCFLAGS RUSTFLAGS RUSTUP_MAX_RETRIES TIDY_EXPECTED_MARKDOWN_FILE_COUNT TIDY_EXPECTED_RUST_FILE_COUNT TIDY_EXPECTED_CLANG_FORMAT_FILE_COUNT TIDY_EXPECTED_PRETTIER_FILE_COUNT TIDY_EXPECTED_TOML_FILE_COUNT TIDY_EXPECTED_SHELL_FILE_COUNT TIDY_EXPECTED_DOCKER_FILE_COUNT
          usesh: true
          custom-shell-name: vm-sh
          copyback: false
        if: matrix.os == 'solaris'
      - uses: vmactions/omnios-vm@df424df5cba0f61cd5275cac0770fe1331ef2edb # v1.3.0
        with:
          release: ${{ matrix.version }}
          envs: CARGO_INCREMENTAL CARGO_NET_RETRY CARGO_TERM_COLOR RUST_BACKTRACE RUST_TEST_THREADS RUSTDOCFLAGS RUSTFLAGS RUSTUP_MAX_RETRIES TIDY_EXPECTED_MARKDOWN_FILE_COUNT TIDY_EXPECTED_RUST_FILE_COUNT TIDY_EXPECTED_CLANG_FORMAT_FILE_COUNT TIDY_EXPECTED_PRETTIER_FILE_COUNT TIDY_EXPECTED_TOML_FILE_COUNT TIDY_EXPECTED_SHELL_FILE_COUNT TIDY_EXPECTED_DOCKER_FILE_COUNT
          usesh: true
          custom-shell-name: vm-sh
          copyback: false
        if: matrix.os == 'omnios'
      - uses: vmactions/openindiana-vm@5c32edca6bc6b08ae4f4e852d85c6f447ff4d5b9 # v1.0.9
        with:
          release: ${{ matrix.version }}
          envs: CARGO_INCREMENTAL CARGO_NET_RETRY CARGO_TERM_COLOR RUST_BACKTRACE RUST_TEST_THREADS RUSTDOCFLAGS RUSTFLAGS RUSTUP_MAX_RETRIES TIDY_EXPECTED_MARKDOWN_FILE_COUNT TIDY_EXPECTED_RUST_FILE_COUNT TIDY_EXPECTED_CLANG_FORMAT_FILE_COUNT TIDY_EXPECTED_PRETTIER_FILE_COUNT TIDY_EXPECTED_TOML_FILE_COUNT TIDY_EXPECTED_SHELL_FILE_COUNT TIDY_EXPECTED_DOCKER_FILE_COUNT
          usesh: true
          custom-shell-name: vm-sh
          copyback: false
        if: matrix.os == 'openindiana'
      - uses: vmactions/haiku-vm@5dbe747796ebb3e41deecc9a08859bc56f2428d0 # v1.0.8
        with:
          release: ${{ matrix.version }}
          envs: CARGO_INCREMENTAL CARGO_NET_RETRY CARGO_TERM_COLOR RUST_BACKTRACE RUST_TEST_THREADS RUSTDOCFLAGS RUSTFLAGS RUSTUP_MAX_RETRIES TIDY_EXPECTED_MARKDOWN_FILE_COUNT TIDY_EXPECTED_RUST_FILE_COUNT TIDY_EXPECTED_CLANG_FORMAT_FILE_COUNT TIDY_EXPECTED_PRETTIER_FILE_COUNT TIDY_EXPECTED_TOML_FILE_COUNT TIDY_EXPECTED_SHELL_FILE_COUNT TIDY_EXPECTED_DOCKER_FILE_COUNT
          usesh: true
          custom-shell-name: vm-sh
          copyback: false
        if: matrix.os == 'haiku'
      - run: |
          set -eux
          tools/ci/tidy-setup.sh
          tools/ci/tidy-show-deps.sh
          tools/ci/tidy.sh
  test-old-tidy-vm2:
    needs: tidy
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            version: '15.0'
          - os: freebsd
            version: '14.4'
          - os: freebsd
            version: '13.5'
          - os: freebsd
            version: '12.4'
          - os: netbsd
            version: '10.1'
          - os: netbsd
            version: '9.4'
          - os: openbsd
            version: '7.9'
          - os: dragonflybsd
            version: '6.4.2'
          - os: midnightbsd
            version: '4.0.4'
          - os: omnios
            version: 'r151058'
          - os: haiku
            version: 'r1beta5'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: taiki-e/checkout-action@v1
      - uses: taiki-e/github-actions/free-device-space@main
        if: matrix.os == 'netbsd' || matrix.os == 'omnios'
      - uses: taiki-e/cross-platform-actions-action@max
        with:
          environment_variables: CARGO_INCREMENTAL CARGO_NET_RETRY CARGO_TERM_COLOR RUST_BACKTRACE RUST_TEST_THREADS RUSTDOCFLAGS RUSTFLAGS RUSTUP_MAX_RETRIES TIDY_EXPECTED_MARKDOWN_FILE_COUNT TIDY_EXPECTED_RUST_FILE_COUNT TIDY_EXPECTED_CLANG_FORMAT_FILE_COUNT TIDY_EXPECTED_PRETTIER_FILE_COUNT TIDY_EXPECTED_TOML_FILE_COUNT TIDY_EXPECTED_SHELL_FILE_COUNT TIDY_EXPECTED_DOCKER_FILE_COUNT
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          shell: bash
          sync_files: runner-to-vm
      - run: |
          set -CeEuxo pipefail
          tools/ci/tidy-setup.sh
          tools/ci/tidy-show-deps.sh
          tools/ci/tidy.sh
